name: release

# Publishes a GitHub Release for an annotated SemVer tag v* on main (issue
# #11, RELEASING.md): four archives (darwin and linux, amd64 and arm64),
# checksums.txt, and a build provenance attestation. GoReleaser creates a
# draft; it is published only after the attestation succeeds. The job runs in
# the environment "release": the owner must approve the deployment, and only
# v* tags may deploy to it. The release job holds only the default
# GITHUB_TOKEN. The explicit fetch below has no credentials, so it relies on
# the repository being public.
#
# The job "tap" (issue #46) runs after the release is published, for a stable
# tag only. It is the only job that reads the secret TAP_GITHUB_TOKEN, a
# secret of the environment "release". It opens a PR on the Homebrew tap with
# the formula for the tag. Nothing merges that PR automatically.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: fetch the annotated tag and main
        run: git fetch --force --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}" "+refs/heads/main:refs/remotes/origin/main"
      - name: check the tag
        run: sh .github/scripts/check-release-tag.sh "$TAG" origin/main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: build for this runner
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: build --clean --single-target --id agent-id
      - name: check the version of the binary
        run: sh .github/scripts/check-release-binary.sh dist/agent-id_linux_amd64_v1/agent-id "$TAG"
      - name: release as a draft
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: publish the draft
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tap:
    name: tap
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
      TAP: cultofthecode/homebrew-tap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: render the formula
        run: bash .github/scripts/render-tap-formula.sh "$TAG" "${RUNNER_TEMP}/agent-id.rb"
      - name: open the formula PR on the tap
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "Secret TAP_GITHUB_TOKEN is empty in the release environment. Update the tap by hand (RELEASING.md)." >&2
            exit 1
          fi
          version="${TAG#v}"
          branch="bump-agent-id-${version}"
          formula="${RUNNER_TEMP}/agent-id.rb"
          if [ -n "$(gh pr list --repo "$TAP" --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "A PR for ${branch} is already open. Nothing to do."
            exit 0
          fi
          base="$(gh api "repos/${TAP}" --jq .default_branch)"
          base_sha="$(gh api "repos/${TAP}/git/ref/heads/${base}" --jq .object.sha)"
          current_sha=""
          if gh api "repos/${TAP}/contents/Formula/agent-id.rb?ref=${base_sha}" >"${RUNNER_TEMP}/current.json" 2>/dev/null; then
            current_sha="$(jq -r .sha "${RUNNER_TEMP}/current.json")"
            jq -r .content "${RUNNER_TEMP}/current.json" | base64 -d >"${RUNNER_TEMP}/current.rb"
            if cmp -s "${RUNNER_TEMP}/current.rb" "$formula"; then
              echo "The formula on ${base} already names ${TAG}. Nothing to do."
              exit 0
            fi
          fi
          refs="$(gh api "repos/${TAP}/git/matching-refs/heads/${branch}")"
          if jq -e --arg ref "refs/heads/${branch}" 'any(.[]; .ref == $ref)' <<<"$refs" >/dev/null; then
            echo "${branch} is left from an earlier run and has no open PR. Resetting it to ${base}."
            gh api -X PATCH "repos/${TAP}/git/refs/heads/${branch}" -f "sha=${base_sha}" -F force=true >/dev/null
          else
            gh api "repos/${TAP}/git/refs" -f "ref=refs/heads/${branch}" -f "sha=${base_sha}" >/dev/null
          fi
          args=(-f "message=agent-id ${version}" -f "branch=${branch}" -f "content=$(base64 -w0 "$formula")")
          if [ -n "$current_sha" ]; then
            args+=(-f "sha=${current_sha}")
          fi
          gh api -X PUT "repos/${TAP}/contents/Formula/agent-id.rb" "${args[@]}" >/dev/null
          gh pr create --repo "$TAP" --base "$base" --head "$branch" \
            --title "agent-id ${version}" \
            --body "Release [${TAG}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}) of agent-id. Sets \`url\` and \`sha256\` of the source tarball. Merge after the tap CI passes. Nothing merges this automatically."
