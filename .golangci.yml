version: "2"

linters:
  default: standard
  enable:
    - depguard
  settings:
    depguard:
      rules:
        testenv-only-in-tests:
          list-mode: lax
          files:
            - "$all"
            - "!$test"
            - "!**/internal/testenv/**"
          deny:
            - pkg: github.com/cultofthecode/agent-id/internal/testenv$
              desc: only test files import the test isolation helpers (AGENTS.md, Test isolation)
