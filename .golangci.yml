version: "2"

linters:
  default: standard
  enable:
    - depguard
  settings:
    depguard:
      rules:
        testenv-only-in-tests:
          list-mode: lax
          files:
            - "$all"
            - "!$test"
            - "!**/internal/testenv/**"
            - "!**/internal/provider/providertest/**"
            - "!**/internal/provider/github/githubtest/**"
          deny:
            - pkg: github.com/cultofthecode/agent-id/internal/testenv$
              desc: only test files and the test helper packages import the test isolation helpers (AGENTS.md, Test isolation)
        test-helpers-only-in-tests:
          list-mode: lax
          files:
            - "$all"
            - "!$test"
          deny:
            - pkg: github.com/cultofthecode/agent-id/internal/provider/providertest$
              desc: only test files import the provider contract and fake (AGENTS.md, Test isolation)
            - pkg: github.com/cultofthecode/agent-id/internal/provider/github/githubtest$
              desc: only test files import the fake GitHub App (AGENTS.md, Test isolation)
        profile-is-provider-agnostic:
          list-mode: lax
          files:
            - "**/internal/profile/**"
          deny:
            - pkg: github.com/cultofthecode/agent-id/internal/provider
              desc: the profile store imports no provider package, so that adapters can import it (ADR #35, profile-config spec)
        token-uses-only-the-provider-port:
          list-mode: lax
          files:
            - "**/internal/token/**"
          deny:
            - pkg: github.com/cultofthecode/agent-id/internal/profile
              desc: the token manager depends on internal/provider only (ARCHITECTURE.md, token-manager spec)
            - pkg: github.com/cultofthecode/agent-id/internal/credential
              desc: the token manager depends on internal/provider only; the provider loads its key (ARCHITECTURE.md, token-manager spec)
            - pkg: github.com/cultofthecode/agent-id/internal/activation
              desc: the token manager depends on internal/provider only; its consumers import it, not the reverse
            - pkg: github.com/cultofthecode/agent-id/internal/gitint
              desc: the token manager depends on internal/provider only; its consumers import it, not the reverse
            - pkg: github.com/cultofthecode/agent-id/internal/cliint
              desc: the token manager depends on internal/provider only; its consumers import it, not the reverse
            - pkg: github.com/cultofthecode/agent-id/internal/diagnose
              desc: the token manager depends on internal/provider only; its consumers import it, not the reverse
        github-only-in-its-adapter:
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/provider/github/**"
            - "!**/cmd/agent-id/main.go"
          deny:
            - pkg: github.com/cultofthecode/agent-id/internal/provider/github
              desc: core depends on internal/provider only; GitHub code stays in its adapter, and only the composition root wires it (ADR #35)
